name: MonAvi
options:
  bundleIdPrefix: app.monavi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
targets:
  MonAvi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MonAvi
        excludes:
          - Resources/Info.plist
          - Resources/MonAvi.entitlements
    info:
      path: MonAvi/Resources/Info.plist
      properties:
        CFBundleDisplayName: MonAvi
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: MonAvi usa el microfono para que anotes un ingreso o gasto diciendolo en voz alta.
        NSSpeechRecognitionUsageDescription: MonAvi transcribe lo que dices para llenar el monto, la descripcion y la categoria del movimiento por ti.
    entitlements:
      path: MonAvi/Resources/MonAvi.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.app.monavi.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.monavi
        PRODUCT_NAME: MonAvi
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S7ZS3G5284
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
      - target: MonAviWidget
        embed: true
  MonAviWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MonAviWidget
      - path: MonAvi/Shared/BudgetWidgetSnapshot.swift
      - path: MonAvi/Core/ColorHex.swift
    info:
      path: MonAviWidget/Info.plist
      properties:
        CFBundleDisplayName: MonAvi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MonAviWidget/MonAviWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.monavi.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.monavi.widget
        PRODUCT_NAME: MonAviWidget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S7ZS3G5284
schemes:
  MonAvi:
    build:
      targets:
        MonAvi: all
    run:
      config: Debug
      storeKitConfiguration: MonAvi.storekit
    archive:
      config: Release
