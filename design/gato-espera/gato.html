<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<svg id="s" width="600" height="450" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">

  <path fill="none" stroke="#5FE3C4" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round" d="M92 245 C 150 251, 262 251, 320 244"/>
  <circle cx="120" cy="246" r="5" fill="#F4C542"/><circle cx="178" cy="250" r="4" fill="#F4C542" opacity=".9"/>
  <circle cx="262" cy="249" r="5" fill="#F4C542"/><circle cx="305" cy="243" r="3.5" fill="#F4C542" opacity=".9"/>
</g>
<path id="thread" fill="none" stroke="#D44A3A" stroke-width="2.2" stroke-linecap="round" d=""/>
<!-- cola -->
<g id="tail"><path id="tailp" fill="none" stroke="#00A585" stroke-width="15" stroke-linecap="round" d=""/>

<!-- patas traseras (detras del cuerpo) -->

<!-- cuerpo boca arriba -->
<g id="body">
  <path fill="#00A585" d="M118 214 C 118 178, 170 160, 222 162 C 276 164, 304 186, 300 212 C 296 232, 250 236, 205 236 C 160 236, 118 236, 118 214 Z"/>
  <path fill="#FFFFFF" d="M150 196 C 160 178, 205 172, 240 176 C 270 180, 282 196, 270 206 C 250 216, 175 216, 158 210 C 150 207, 146 202, 150 196 Z"/>
  <path fill="#025E4D" d="M258 168 C 272 170, 288 180, 294 194 C 284 190, 270 186, 258 182 Z" opacity=".9"/>
</g>
<!-- patas -->
<g id="legBack2"><path fill="#00A585" d="M0 0 C -9 -2, -12 -30, -6 -52 C -2 -62, 10 -62, 12 -50 C 14 -30, 12 -6, 8 0 Z"/><ellipse cx="3" cy="-55" rx="11" ry="9" fill="#FFFFFF"/>
  <ellipse cx="3" cy="-57" rx="5" ry="3.5" fill="#FF9A8B"/></g>
<g id="legFront1"><path fill="#00A585" d="M0 0 C -8 -2, -10 -26, -5 -46 C -1 -56, 10 -56, 11 -44 C 12 -26, 11 -6, 7 0 Z"/><ellipse cx="3" cy="-49" rx="10" ry="8.5" fill="#FFFFFF"/></g>
<!-- bola de lana -->
<g id="yarn">
  
  <g id="ball">
    <circle r="31" fill="#FF7A66"/>
    <g clip-path="url(#ballclip)" id="strands" fill="none" stroke="#D44A3A" stroke-width="2.2" stroke-linecap="round" opacity=".85">
      <path d="M-34 -14 C -10 -24, 14 -24, 34 -10"/><path d="M-34 -4 C -10 -14, 14 -14, 34 0"/><path d="M-34 6 C -10 -4, 14 -4, 34 10"/><path d="M-34 16 C -10 6, 14 6, 34 20"/>
      <path d="M-6 -34 C -20 -10, -20 14, -4 34"/><path d="M6 -34 C -8 -10, -8 14, 8 34"/>
    </g>
    <path d="M-20 -18 C -14 -26, -4 -29, 4 -28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  </g>
</g>
<g id="legFront2"><path fill="#00A585" d="M0 0 C -8 -2, -10 -26, -5 -46 C -1 -56, 10 -56, 11 -44 C 12 -26, 11 -6, 7 0 Z"/><ellipse cx="3" cy="-49" rx="10" ry="8.5" fill="#FFFFFF"/>
  <ellipse cx="3" cy="-51" rx="4.5" ry="3" fill="#FF9A8B"/></g>
<!-- cabeza -->
<g id="head">
  <path fill="#00A585" d="M-24 -26 L -34 -58 L -6 -36 Z"/><path fill="#FF9A8B" d="M-24 -32 L -29 -50 L -13 -38 Z"/>
  <path fill="#025E4D" d="M18 -32 L 34 -60 L 36 -26 Z"/><path fill="#FF9A8B" d="M22 -33 L 31 -50 L 31 -30 Z"/>
  <ellipse rx="40" ry="35" fill="#00A585"/>
  <path fill="#FFFFFF" d="M-30 8 C -26 -6, -10 -10, 0 -4 C 10 -10, 28 -6, 30 8 C 30 26, -30 26, -30 8 Z"/>
  <g fill="none" stroke="#025E4D" stroke-width="3.2" stroke-linecap="round" opacity=".85"><path d="M-9 -33 C -8 -27, -7 -24, -6 -22"/><path d="M0 -35 L 0 -24"/><path d="M9 -33 C 8 -27, 7 -24, 6 -22"/></g>
  <ellipse cx="-22" cy="10" rx="7" ry="4.5" fill="#FF9A8B" opacity=".75"/><ellipse cx="22" cy="10" rx="7" ry="4.5" fill="#FF9A8B" opacity=".75"/>
  <g id="eyes">
    <g id="eyeL" transform="translate(-14,-6)"><ellipse rx="6.5" ry="7.5" fill="#0E1614"/><circle cx="-2" cy="-3" r="2.3" fill="#fff"/></g>
    <g id="eyeR" transform="translate(14,-6)"><ellipse rx="6.5" ry="7.5" fill="#0E1614"/><circle cx="-2" cy="-3" r="2.3" fill="#fff"/></g>
  </g>
  <path d="M-4 3 L 4 3 L 0 8 Z" fill="#D44A3A"/>
  <path d="M0 8 C -2 12, -7 12, -8 9 M0 8 C 2 12, 7 12, 8 9" fill="none" stroke="#0E1614" stroke-width="1.4" stroke-linecap="round"/>
  <g stroke="#0E1614" stroke-width="1" stroke-linecap="round" opacity=".45">
    <path d="M-26 4 L -46 0"/><path d="M-26 8 L -46 10"/><path d="M26 4 L 46 0"/><path d="M26 8 L 46 10"/></g>
</g>
<!-- ratoncito de juguete -->
<g id="mouse">
  <path d="M0 0 C 0 -12, 22 -12, 24 0 Z" fill="#5FE3C4"/><circle cx="6" cy="-9" r="4.5" fill="#5FE3C4"/><circle cx="6" cy="-9" r="2.2" fill="#FF9A8B"/>
  <circle cx="20" cy="-4" r="1.3" fill="#0E1614"/><path id="mtail" d="M0 -2 C -8 -2, -10 4, -18 2" fill="none" stroke="#3FBF9F" stroke-width="1.6" stroke-linecap="round"/>
</g>
</svg>
<script>
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,FR=48;
function blob(cx,cy,rx,ry,t,k){let d='';const n=8;const pts=[];
  for(let i=0;i<n;i++){const a=i/n*TAU;const r=1+0.08*Math.sin(a*3+t*TAU+k)+0.05*Math.cos(a*2-t*TAU);pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r]);}
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    if(i===0)d+=`M${p1[0]} ${p1[1]}`;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0]} ${c1[1]},${c2[0]} ${c2[1]},${p2[0]} ${p2[1]}`;}
  return d+'Z';}
window.render=function(f){const t=f/FR;const p=t*TAU;
  const bd=blob(205,150,150,110,t,0);$('blob').setAttribute('d',bd);$('blobc').setAttribute('d',bd);
  $('blob2').setAttribute('d',blob(225,120,95,72,t,2));
  // la bola rebota entre las patas
  const up=Math.abs(Math.sin(p));             // 2 rebotes por ciclo
  const by=118-30*up, bx=205+6*Math.sin(p);
  const rot=t*360*2;
  $('ball').setAttribute('transform',`translate(${bx},${by}) rotate(${rot})`);
  $('thread').setAttribute('d',`M${bx+26} ${by+12} C ${bx+70} ${by+10}, ${352} ${150}, ${356} ${200} S ${350} ${246}, ${340} ${250}`);
  const push=1-up; // patas empujan cuando la bola baja
  const bend=(a)=>a*180/Math.PI;
  $('legFront1').setAttribute('transform',`translate(166,182) rotate(${18-14*push})`);
  $('legFront2').setAttribute('transform',`translate(182,180) rotate(${8-16*push+4*Math.sin(p*2)})`);
  $('legBack1').setAttribute('transform',`translate(232,180) rotate(${-14+12*Math.sin(p*2+1)})`);
  $('legBack2').setAttribute('transform',`translate(250,182) rotate(${-22+14*push})`);
  // cabeza mira la bola
  $('head').setAttribute('transform',`translate(124,186) rotate(${-14+4*Math.sin(p*2)})`);
  const lx=(bx-124)/40, ly=(by-150)/60;
  ['eyeL','eyeR'].forEach((id,i)=>{const x=(i?14:-14)+2.2*lx, y=-6+2.2*ly;
    const blink=(f>=36&&f<=39)?[0.5,0.1,0.1,0.5][f-36]:1;
    $(id).setAttribute('transform',`translate(${x},${y}) scale(1,${blink})`);});
  // cola
  const w=Math.sin(p*2);
  const tp=`M296 214 C 330 214, 340 ${190-6*w}, ${332+10*w} ${160-4*w}`;
  $('tailp').setAttribute('d',tp);
  $('tailtip').setAttribute('d',`M${336+10*w} ${172-4*w} C ${334+10*w} ${166-4*w}, ${333+10*w} ${163-4*w}, ${332+10*w} ${160-4*w}`);
  $('body').setAttribute('transform',`translate(0,${1.2*Math.sin(p*2)})`);
  $('mouse').setAttribute('transform',`translate(318,${254}) rotate(${3*Math.sin(p*4)},12,-4)`);
  $('mtail').setAttribute('d',`M0 -2 C -8 -2, -10 ${4+3*Math.sin(p*4)}, -18 ${2-2*Math.sin(p*4)}`);
};
render(0);
</script></body></html>
