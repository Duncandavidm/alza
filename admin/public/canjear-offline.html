<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#027a64">
<title>Sin conexión — MonAvi Caja</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f4f7f6; color: #12201d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 340px; margin: 16px; padding: 28px 24px; background: #fff; border-radius: 20px; text-align: center;
          box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #5b6462; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: #027a64; color: #fff; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <img src="/caja/icon-192.png" alt="">
    <h1>Sin conexión a internet</h1>
    <p>Para validar un canje la caja necesita internet. Revisa el Wi-Fi o los datos e intenta de nuevo.</p>
    <button onclick="location.href='/canjear'">Reintentar</button>
  </div>
</body>
</html>
