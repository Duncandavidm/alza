<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Confirma tu correo</title>
</head>
<body style="margin:0;padding:0;background:#f4f7f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#12201d;">
  <div style="display:none;max-height:0;overflow:hidden;">Tu código es {{ .Token }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7f6;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:20px;overflow:hidden;">
        <tr><td align="center" style="background:#027a64;background-image:linear-gradient(135deg,#027a64,#0e1614);padding:28px 24px;">
          <img src="https://monavi.maday.app/email/monavi-logo-white.png" width="42" height="49" alt="MonAvi" style="display:block;border:0;">
          <div style="color:#ffffff;font-size:20px;font-weight:700;margin-top:10px;letter-spacing:.2px;">MonAvi</div>
        </td></tr>
        <tr><td style="padding:32px 28px 8px;">
          <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#12201d;">¡Bienvenido a MonAvi!</h1>
          <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#3d4a47;">Para confirmar tu correo, escribe este código en la app:</p>
          <div style="text-align:center;margin:8px 0 4px;">
            <div style="display:inline-block;background:#e8f4f1;border-radius:14px;padding:16px 26px;font-size:34px;font-weight:800;letter-spacing:10px;color:#027a64;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</div>
          </div>
          <p style="margin:12px 0 0;font-size:13px;text-align:center;color:#6b7774;">El código vence en 1 hora.</p>
          <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6b7774;">Si no creaste una cuenta en MonAvi, ignora este correo.</p>
        </td></tr>
        <tr><td style="padding:24px 28px 28px;">
          <hr style="border:none;border-top:1px solid #e4e9e7;margin:0 0 16px;">
          <p style="margin:0;font-size:12px;line-height:1.6;color:#8a9592;">
            MonAvi — tus gastos, tu ahorro y tus premios.<br>
            ¿Dudas? Escríbenos a <a href="mailto:hola@maday.app" style="color:#027a64;">hola@maday.app</a>
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
