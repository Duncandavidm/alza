name: MonAvi
options:
  bundleIdPrefix: app.monavi
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
targets:
  MonAvi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MonAvi
        excludes:
          - Resources/Info.plist
          - Resources/MonAvi.entitlements
    info:
      path: MonAvi/Resources/Info.plist
      properties:
        CFBundleDisplayName: MonAvi
        CFBundleIconName: AppIcon
        # Version y build salen de MARKETING_VERSION / CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # La app esta en espanol: fechas, meses y numeros en espanol aunque
        # el iPhone este en otro idioma.
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        # Pantalla de arranque oscura con el mark de MonAvi (nunca blanca):
        # mismo color que el fondo de BrandLoadingView para que el paso
        # launch -> carga sea continuo.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: MonAvi usa el microfono para que anotes un ingreso o gasto diciendolo en voz alta.
        NSSpeechRecognitionUsageDescription: MonAvi transcribe lo que dices para llenar el monto, la descripcion y la categoria del movimiento por ti.
        NSCameraUsageDescription: MonAvi usa la camara para escanear el codigo QR de tus facturas electronicas y registrar el gasto automaticamente.
    entitlements:
      path: MonAvi/Resources/MonAvi.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.app.monavi.shared
        # Avisos del dia de pago que suenan aun con un modo de concentracion.
        com.apple.developer.usernotifications.time-sensitive: true
        # Notificaciones push del servidor (ej. "sumaste puntos"). Xcode lo
        # cambia solo a "production" al archivar para TestFlight/App Store.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.monavi
        PRODUCT_NAME: MonAvi
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S7ZS3G5284
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
      - target: MonAviWidget
        embed: true
  MonAviWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MonAviWidget
      - path: MonAvi/Shared/BudgetWidgetSnapshot.swift
      - path: MonAvi/Core/ColorHex.swift
    info:
      path: MonAviWidget/Info.plist
      properties:
        CFBundleDisplayName: MonAvi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MonAviWidget/MonAviWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.monavi.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.monavi.widget
        PRODUCT_NAME: MonAviWidget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S7ZS3G5284
  MonAviTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MonAviTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S7ZS3G5284
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MonAvi
schemes:
  MonAvi:
    build:
      targets:
        MonAvi: all
        MonAviTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MonAviTests
    archive:
      config: Release
